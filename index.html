<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Параллелограмм, ромб, тіктөртбұрыш, шаршы</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Nunito:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4f6ff;--mut:#aab4de;--card:rgba(255,255,255,.07)}
html,body{margin:0;height:100%;background:#070b20;overflow:hidden;font-family:'Nunito','Noto Sans',sans-serif;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;background:radial-gradient(circle at 85% 8%,#2b3690 0,#0b1230 58%);overflow:hidden;border-radius:12px}
.slide{position:absolute;inset:0;padding:40px 64px 70px;display:none;flex-direction:column}
.slide.on{display:flex;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
i{display:block;color:var(--mut);font-style:italic;font-weight:600}
h2{margin:0;font:800 44px Montserrat,sans-serif;color:var(--a,#fff)}
h2 i{font:italic 600 23px Nunito,sans-serif;color:var(--mut);margin-top:4px}
.row{display:flex;gap:30px;flex:1;margin-top:22px;min-height:0}
.figbox{width:440px;background:var(--card);border-radius:28px;display:flex;align-items:center;justify-content:center;padding:18px;border:2px solid color-mix(in srgb,var(--a) 50%,transparent)}
.col{flex:1;background:var(--card);border-radius:28px;padding:22px 28px;overflow:hidden}
.col h3{margin:0 0 16px;font:800 28px Montserrat,sans-serif;color:var(--a)}
.col h3 i{font:italic 600 18px Nunito,sans-serif}
ul{list-style:none;margin:0;padding:0}
li{margin:0 0 14px;padding-left:16px;border-left:5px solid var(--a);font-size:21px;font-weight:700;line-height:1.25}
li i{font-size:17px;margin-top:2px;font-weight:600}
.fig{width:100%;height:auto}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:22px;flex:1}
.card{background:var(--card);border-radius:26px;padding:18px 20px;border-top:6px solid var(--a)}
.card h3{margin:6px 0 10px;font:800 28px Montserrat,sans-serif;color:var(--a)}
.card h3 i{font:italic 600 17px Nunito,sans-serif}
.card p{margin:0;font-size:20px;font-weight:700;line-height:1.28}
.card p i{font-size:16.5px;margin-top:4px}
.title{justify-content:center;padding-top:30px}
.title h1{margin:0;font:800 62px/1.1 Montserrat,sans-serif;background:linear-gradient(90deg,#4facfe,#34d399,#f472b6,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.title h1+i{font-size:30px;margin:10px 0 24px}
.goal{background:var(--card);border-left:6px solid #fbbf24;border-radius:18px;padding:14px 22px;font-size:24px;font-weight:700;max-width:1250px}
.goal i{font-size:20px}
.shapes{display:flex;gap:16px;margin:26px 0 22px}
.shapes svg{width:300px;height:auto}
.by{font-size:23px;font-weight:700}.by i{font-size:19px}
.grade{position:absolute;right:64px;top:44px;font:800 26px Montserrat;color:#fbbf24}
.nav{position:absolute;right:30px;bottom:18px;display:flex;gap:12px;align-items:center;font:700 18px Nunito;color:var(--mut)}
.nav button{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:24px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.28)}
#bar{position:absolute;left:0;bottom:0;height:6px;background:linear-gradient(90deg,#4facfe,#f472b6,#fbbf24);transition:width .4s}
.sol{font-size:23px}
.tc{padding:16px 22px}.tc h3{margin:0 0 6px;font-size:26px}.tc .fig{height:185px;width:100%}.tc p{margin:0 0 8px;font-size:18px;font-weight:700;line-height:1.25}.tc p i{font-size:15px}.tc .pb{border-left:5px solid var(--a);padding-left:12px}.tc .sl{color:#e9edff}
.sol li{font-size:23px}.sol li i{font-size:18px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4facfe"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
<linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".4"/></filter>
</defs></svg>
<div id="stage"></div>
<script>
const A=['#4facfe','#34d399','#f472b6','#fbbf24'];
const SH={p:{c:0,pts:[[30,170],[100,35],[270,35],[200,170]],O:[150,102.5],tk:[1,2,1,2]},
r:{c:1,pts:[[40,160],[40,40],[260,40],[260,160]],O:[150,100],tk:[1,2,1,2]},
h:{c:2,pts:[[45,100],[150,15],[255,100],[150,185]],O:[150,100],tk:[1,1,1,1]},
s:{c:3,pts:[[80,170],[80,30],[220,30],[220,170]],O:[150,100],tk:[1,1,1,1]}};
const n1=(a,b,k)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy);return[dx/l*k,dy/l*k]};
function fig(t,o={}){const {c,pts,O,tk}=SH[t];const d=o.diag!==false;
let s=`<svg viewBox="-10 -15 320 230" class="fig"><polygon points="${pts.join(' ')}" fill="url(#g${c})" stroke="#fff" stroke-width="3" stroke-linejoin="round" filter="url(#sh)"/>`;
if(d){s+=`<g stroke="#fff" stroke-width="2" stroke-dasharray="6 5" opacity=".9"><line x1="${pts[0][0]}" y1="${pts[0][1]}" x2="${pts[2][0]}" y2="${pts[2][1]}"/><line x1="${pts[1][0]}" y1="${pts[1][1]}" x2="${pts[3][0]}" y2="${pts[3][1]}"/></g><circle cx="${O[0]}" cy="${O[1]}" r="3.5" fill="#fff"/>`;}
s+=`<g stroke="#fff" stroke-width="2.5" stroke-linecap="round" fill="none">`;
pts.forEach((a,i)=>{const b=pts[(i+1)%4],n=tk[i],m=[(a[0]+b[0])/2,(a[1]+b[1])/2],u=n1(a,b,1);
for(let k=0;k<n;k++){const off=(k-(n-1)/2)*6,x=m[0]+u[0]*off,y=m[1]+u[1]*off;s+=`<line x1="${x-u[1]*6}" y1="${y+u[0]*6}" x2="${x+u[1]*6}" y2="${y-u[0]*6}"/>`;}});
if('rs'.includes(t))pts.forEach((p,i)=>{const a=n1(p,pts[(i+3)%4],12),b=n1(p,pts[(i+1)%4],12);s+=`<path stroke-width="2" d="M${p[0]+a[0]} ${p[1]+a[1]}l${b[0]} ${b[1]}l${-a[0]} ${-a[1]}"/>`});
if(d&&t=='h')s+=`<path stroke-width="2" d="M150 90h10v10"/>`;
if(d&&t=='s')s+=`<path stroke-width="2" d="M158.5 91.5L167 100L158.5 108.5"/>`;
s+=`</g><g fill="#fff" font-family="Montserrat,sans-serif" font-weight="800" font-size="17" text-anchor="middle" dominant-baseline="central">`;
pts.forEach((p,i)=>{const u=n1(O,p,17);s+=`<text x="${p[0]+u[0]}" y="${p[1]+u[1]}">${'ABCD'[i]}</text>`});
if(d)s+=`<text x="${O[0]-16}" y="${O[1]-7}" font-size="15">O</text>`;
return s+'</g></svg>'}
const li=a=>a.map(([k,r])=>`<li>${k}<i>${r}</i></li>`).join('');
function sl(t,title,tr,P,S){const a=A[SH[t].c];return `<section class="slide" style="--a:${a}"><h2>${title}<i>${tr}</i></h2><div class="row"><div class="figbox">${fig(t)}</div><div class="col"><h3>Қасиеттері<i>Свойства</i></h3><ul>${li(P)}</ul></div><div class="col"><h3>Белгілері<i>Признаки</i></h3><ul>${li(S)}</ul></div></div></section>`}
const card=(t,n,nr,k,r)=>`<div class="card" style="--a:${A[SH[t].c]}">${fig(t,{diag:false})}<h3>${n}<i>${nr}</i></h3><p>${k}<i>${r}</i></p></div>`;
const V=`<svg viewBox="0 0 700 420" style="width:100%"><defs><clipPath id="c1"><ellipse cx="240" cy="225" rx="200" ry="125"/></clipPath></defs>
<rect x="8" y="8" width="684" height="404" rx="44" fill="url(#g0)" opacity=".28" stroke="#4facfe" stroke-width="3"/>
<text x="350" y="52" text-anchor="middle" fill="#fff" font-family="Montserrat" font-weight="800" font-size="26">Параллелограмм</text>
<ellipse cx="240" cy="225" rx="200" ry="125" fill="url(#g1)" opacity=".85" stroke="#fff" stroke-width="3"/>
<ellipse cx="460" cy="225" rx="200" ry="125" fill="url(#g2)" opacity=".85" stroke="#fff" stroke-width="3"/>
<ellipse cx="460" cy="225" rx="200" ry="125" fill="url(#g3)" stroke="#fff" stroke-width="3" clip-path="url(#c1)"/>
<g fill="#fff" text-anchor="middle" font-family="Montserrat" font-weight="800"><text x="150" y="222" font-size="25">Тіктөртбұрыш</text><text x="550" y="222" font-size="30">Ромб</text><text x="350" y="222" font-size="28" fill="#3b1d00">Шаршы</text></g>
<g fill="#fff" text-anchor="middle" font-family="Nunito" font-style="italic" font-weight="700" font-size="18"><text x="150" y="250">Прямоугольник</text><text x="550" y="250">Ромб</text><text x="350" y="250" fill="#3b1d00">Квадрат</text></g></svg>`;
const S=[];
S.push(`<section class="slide title" style="--a:#fbbf24"><div class="grade">8Ә · Геометрия</div>
<h1>Параллелограмм, ромб, тіктөртбұрыш, шаршы және олардың қасиеттері мен белгілері</h1>
<i>Параллелограмм, ромб, прямоугольник, квадрат, их свойства и признаки</i>
<div class="shapes">${['p','r','h','s'].map(t=>fig(t,{diag:false})).join('')}</div>
<div class="goal">Оқу мақсаты 8.1.1.6: тіктөртбұрыш, ромб, шаршы анықтамаларын білу және олардың қасиеттері мен белгілерін қорытып шығару.<i>Цель обучения 8.1.1.6: знать определения прямоугольника, ромба и квадрата, выводить их свойства и признаки.</i></div>
<p class="by" style="margin:22px 0 0">Дайындаған: математика мұғалімі — Кунгозин Даулет Багдашұлы<i>Подготовил: учитель математики — Кунгозин Даулет Багдашұлы</i></p></section>`);
S.push(`<section class="slide" style="--a:#fbbf24"><h2>Анықтамалар<i>Определения</i></h2><div class="cards">
${card('p','Параллелограмм','Параллелограмм','Қарама-қарсы қабырғалары қос-қостан параллель төртбұрыш.','Четырёхугольник, у которого противоположные стороны попарно параллельны.')}
${card('r','Тіктөртбұрыш','Прямоугольник','Барлық бұрыштары тік болатын параллелограмм.','Параллелограмм, у которого все углы прямые.')}
${card('h','Ромб','Ромб','Барлық қабырғалары тең болатын параллелограмм.','Параллелограмм, у которого все стороны равны.')}
${card('s','Шаршы','Квадрат','Барлық бұрыштары тік және барлық қабырғалары тең параллелограмм.','Параллелограмм, у которого все углы прямые и все стороны равны.')}
</div></section>`);
S.push(sl('p','Параллелограмм','Параллелограмм',
[['Қарама-қарсы қабырғалары тең: AB = CD, BC = AD.','Противоположные стороны равны.'],['Қарама-қарсы бұрыштары тең: ∠A = ∠C, ∠B = ∠D.','Противоположные углы равны.'],['Диагональдары қиылысу нүктесінде тең бөлінеді: AO = OC, BO = OD.','Диагонали точкой пересечения делятся пополам.'],['Іргелес бұрыштарының қосындысы 180°.','Сумма соседних углов равна 180°.']],
[['Қарама-қарсы қабырғалары қос-қостан тең төртбұрыш — параллелограмм.','Четырёхугольник с попарно равными противоположными сторонами — параллелограмм.'],['Қарама-қарсы екі қабырғасы тең және параллель төртбұрыш — параллелограмм.','Четырёхугольник с двумя равными и параллельными противоположными сторонами — параллелограмм.'],['Диагональдары қиылысу нүктесінде тең бөлінетін төртбұрыш — параллелограмм.','Четырёхугольник, диагонали которого делятся точкой пересечения пополам, — параллелограмм.']]));
S.push(sl('r','Тіктөртбұрыш','Прямоугольник',
[['Параллелограмның барлық қасиеттері орындалады.','Выполняются все свойства параллелограмма.'],['Барлық бұрыштары тік: ∠A = ∠B = ∠C = ∠D = 90°.','Все углы прямые.'],['Диагональдары тең: AC = BD.','Диагонали равны.']],
[['Бір бұрышы тік параллелограмм — тіктөртбұрыш.','Параллелограмм с одним прямым углом — прямоугольник.'],['Диагональдары тең параллелограмм — тіктөртбұрыш.','Параллелограмм с равными диагоналями — прямоугольник.'],['Үш бұрышы тік төртбұрыш — тіктөртбұрыш.','Четырёхугольник с тремя прямыми углами — прямоугольник.']]));
S.push(sl('h','Ромб','Ромб',
[['Барлық қабырғалары тең: AB = BC = CD = DA.','Все стороны равны.'],['Диагональдары перпендикуляр: AC ⊥ BD.','Диагонали взаимно перпендикулярны.'],['Диагональдары бұрыштарының биссектрисалары болады.','Диагонали являются биссектрисами углов.'],['Параллелограмның барлық қасиеттері орындалады.','Выполняются все свойства параллелограмма.']],
[['Іргелес екі қабырғасы тең параллелограмм — ромб.','Параллелограмм с равными соседними сторонами — ромб.'],['Диагональдары перпендикуляр параллелограмм — ромб.','Параллелограмм с перпендикулярными диагоналями — ромб.'],['Диагоналі бұрышын тең бөлетін параллелограмм — ромб.','Параллелограмм, у которого диагональ делит угол пополам, — ромб.']]));
S.push(sl('s','Шаршы','Квадрат',
[['Барлық қабырғалары тең, барлық бұрыштары 90°.','Все стороны равны, все углы по 90°.'],['Диагональдары тең, перпендикуляр және қиылысу нүктесінде тең бөлінеді.','Диагонали равны, перпендикулярны и точкой пересечения делятся пополам.'],['Диагоналі бұрышты 45°-қа бөледі.','Диагональ делит угол на два по 45°.']],
[['Іргелес қабырғалары тең тіктөртбұрыш — шаршы.','Прямоугольник с равными соседними сторонами — квадрат.'],['Бір бұрышы тік ромб — шаршы.','Ромб с прямым углом — квадрат.'],['Диагональдары тең және перпендикуляр параллелограмм — шаршы.','Параллелограмм с равными и перпендикулярными диагоналями — квадрат.']]));
S.push(`<section class="slide" style="--a:#fbbf24"><h2>Фигуралар арасындағы байланыс<i>Связь между фигурами</i></h2><div class="row"><div class="figbox" style="width:760px">${V}</div><div class="col"><ul style="margin-top:10px">${li([
['Тіктөртбұрыш пен ромб — параллелограмның дербес жағдайлары.','Прямоугольник и ромб — частные случаи параллелограмма.'],
['Шаршы — тіктөртбұрыш та, ромб та.','Квадрат — одновременно и прямоугольник, и ромб.'],
['Шаршыда үш фигураның да барлық қасиеттері орындалады.','У квадрата выполняются все свойства трёх фигур.']])}</ul></div></div></section>`);
S.push(`<section class="slide" style="--a:#f472b6"><h2>Есеп шығару<i>Решение задачи</i></h2><div class="row"><div class="figbox">${fig('h')}</div><div class="col sol"><h3>Берілгені: ABCD — ромб, AC = 12 см, BD = 16 см. AB = ?<i>Дано: ABCD — ромб, AC = 12 см, BD = 16 см. Найти AB.</i></h3><ul>${li([
['1) Ромб диагональдары перпендикуляр және O нүктесінде тең бөлінеді: AO = 6 см, BO = 8 см.','Диагонали ромба перпендикулярны и точкой O делятся пополам.'],
['2) AOB — тікбұрышты үшбұрыш: AB² = AO² + BO² = 36 + 64 = 100.','AOB — прямоугольный треугольник, применяем теорему Пифагора.'],
['3) AB = 10 см. Периметр P = 4 · 10 = 40 см.','Сторона равна 10 см, периметр равен 40 см.']])}</ul></div></div></section>`);
const tc=(t,n,nr,p,s)=>`<div class="col tc" style="--a:${A[SH[t].c]}"><h3>${n}<i>${nr}</i></h3>${fig(t)}<p class="pb">${p[0]}<i>${p[1]}</i></p><p class="sl">${s[0]}<i>${s[1]}</i></p></div>`;
const ts=(h,r,a,b,c)=>`<section class="slide" style="--a:#fbbf24"><h2>${h}<i>${r}</i></h2><div class="row">${a}${b}${c}</div></section>`;
S.push(ts('Есептер шығару — 2','Решение задач — 2',
tc('h','Ромб','Ромб',['ABCD ромбында ∠A = 60°, AB = 8 см. BD диагоналін және периметрін табыңыз.','В ромбе ABCD ∠A = 60°, AB = 8 см. Найдите диагональ BD и периметр.'],['AB = AD және ∠A = 60°, сондықтан ABD — тең қабырғалы үшбұрыш: BD = 8 см. P = 4 · 8 = 32 см.','Так как AB = AD и ∠A = 60°, треугольник ABD равносторонний: BD = 8 см, P = 32 см.']),
tc('p','Параллелограмм','Параллелограмм',['Параллелограмның периметрі 36 см, AB қабырғасы BC қабырғасынан 4 см үлкен. Қабырғаларын табыңыз.','Периметр параллелограмма 36 см, сторона AB на 4 см больше BC. Найдите стороны.'],['AB + BC = 18 және AB = BC + 4, сондықтан 2·BC + 4 = 18. BC = 7 см, AB = 11 см.','AB + BC = 18 и AB = BC + 4, значит 2·BC + 4 = 18. BC = 7 см, AB = 11 см.']),
tc('r','Тіктөртбұрыш','Прямоугольник',['Тіктөртбұрышта AB = 6 см, BC = 8 см. AC диагоналін табыңыз.','В прямоугольнике AB = 6 см, BC = 8 см. Найдите диагональ AC.'],['ABC — тікбұрышты үшбұрыш: AC² = 36 + 64 = 100. AC = 10 см.','ABC — прямоугольный треугольник: AC² = 36 + 64 = 100, AC = 10 см.'])));
S.push(ts('Есептер шығару — 3','Решение задач — 3',
tc('h','Ромб','Ромб',['Ромбының қабырғасы 13 см, бір диагоналі 10 см. Екінші диагоналін табыңыз.','Сторона ромба 13 см, одна диагональ 10 см. Найдите другую диагональ.'],['AO = 5 см, AB = 13 см. AOB үшбұрышынан BO² = 169 − 25 = 144, BO = 12 см. BD = 24 см.','AO = 5 см, AB = 13 см. Из треугольника AOB: BO² = 169 − 25 = 144, BO = 12 см, BD = 24 см.']),
tc('p','Параллелограмм','Параллелограмм',['Параллелограмда ∠A бұрышы ∠B бұрышынан 40° кіші. Параллелограмның барлық бұрыштарын табыңыз.','В параллелограмме ∠A на 40° меньше ∠B. Найдите все углы.'],['∠A + ∠B = 180° және ∠B = ∠A + 40°, сондықтан ∠A = 70°, ∠B = 110°. ∠C = 70°, ∠D = 110°.','∠A + ∠B = 180° и ∠B = ∠A + 40°, значит ∠A = 70°, ∠B = 110°; ∠C = 70°, ∠D = 110°.']),
tc('r','Тіктөртбұрыш','Прямоугольник',['Тіктөртбұрыштың диагональдары 60° бұрышпен қиылысады, диагоналі 10 см. Кіші қабырғасын табыңыз.','Диагонали прямоугольника пересекаются под углом 60°, диагональ 10 см. Найдите меньшую сторону.'],['AO = BO = 5 см және ∠AOB = 60°, сондықтан AOB — тең қабырғалы үшбұрыш: AB = 5 см.','AO = BO = 5 см и ∠AOB = 60°, поэтому AOB — равносторонний треугольник: AB = 5 см.'])));
const st=document.getElementById('stage');
st.innerHTML=S.join('')+`<div id="bar"></div><div class="nav"><span id="cnt"></span><button id="pv" aria-label="Назад">‹</button><button id="nx" aria-label="Вперёд">›</button></div>`;
const SL=[...st.querySelectorAll('.slide')];let n=0;
function go(i){n=Math.max(0,Math.min(SL.length-1,i));SL.forEach((e,j)=>e.classList.toggle('on',j==n));cnt.textContent=(n+1)+' / '+SL.length;bar.style.width=(n+1)/SL.length*100+'%';try{history.replaceState(null,'','#s'+(n+1))}catch(e){}}
function fit(){st.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1600,innerHeight/900)})`}
addEventListener('resize',fit);fit();
pv.onclick=()=>go(n-1);nx.onclick=()=>go(n+1);
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))go(n+1);if(['ArrowLeft','PageUp'].includes(e.key))go(n-1);if(e.key=='Home')go(0);if(e.key=='End')go(SL.length-1);if(e.key=='f')document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()});
let tx=0;addEventListener('touchstart',e=>tx=e.touches[0].clientX);addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)go(n+(d<0?1:-1))});
const m=/#s(\d+)/.exec(location.hash);go(m?m[1]-1:0);
</script>
</body>
